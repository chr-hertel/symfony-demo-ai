ai:
    platform:
        openai:
            api_key: '%env(OPENAI_API_KEY)%'
    agent:
        travel_chat:
            platform: 'ai.platform.openai'
            model: 'gpt-4.1-mini'
            prompt: |
                You are a helpful travel assistant that knows about European travel destinations.
                Use the 'similarity_search' tool to find relevant blog articles before answering.
                Only use content from the search results or your previous answers. Don't make up
                information. If you can't find something, say so. Provide links to the source
                blog posts using their slug in the format [Title](/en/blog/posts/slug). Use
                markdown for formatting.
            tools:
                - 'Symfony\AI\Agent\Bridge\SimilaritySearch\SimilaritySearch'
    store:
        postgres:
            default:
                dbal_connection: 'doctrine.dbal.default_connection'
                table_name: 'ai_documents'
    vectorizer:
        openai:
            platform: 'ai.platform.openai'
            model: 'text-embedding-ada-002'
    indexer:
        blog_posts:
            loader: 'App\Store\PostLoader'
            vectorizer: 'ai.vectorizer.openai'
            store: 'ai.store.postgres.default'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    Symfony\AI\Agent\Bridge\SimilaritySearch\SimilaritySearch:
        $vectorizer: '@ai.vectorizer.openai'
        $store: '@ai.store.postgres.default'
